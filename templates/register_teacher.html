{% extends "base.html" %}
{% block content %}<div class="login-shell"><section class="login-card"><div class="eyebrow">TEACHER REGISTRATION</div><h1>Teacher details</h1><p class="muted">Enter the subjects you teach separated by commas.</p><form method="post"><label>Full name<input name="full_name" required autofocus></label><label>Class/cohort<select name="class_name" required><option value="">Select cohort</option>{% for class_name in classes %}<option value="{{ class_name }}">{{ class_name }}</option>{% endfor %}</select></label><label>Subjects<input name="subjects" placeholder="Biology, Chemistry" required></label><button class="button primary wide">Continue to teacher page</button></form><p class="login-help"><a href="{{ url_for('login') }}">Back to sign in</a></p></section></div>{% endblock %}
