{% extends "base.html" %}
{% block content %}<div class="login-shell"><section class="login-card"><div class="eyebrow">STUDENT REGISTRATION</div><h1>Student details</h1><p class="muted">Use the student access code supplied by the administrator. Codes expire after their assigned duration.</p><form method="post"><label>Full name<input name="full_name" autocomplete="name" required></label><label>Class<select name="class_name" required><option value="">Select your class</option>{% for class_name in classes %}<option value="{{ class_name }}">{{ class_name }}</option>{% endfor %}</select></label><label>Student access code<input name="access_code" autocomplete="off" autocapitalize="characters" required></label><button class="button primary wide">Continue to exams</button></form><p class="login-help"><a href="{{ url_for('login') }}">Back to sign in</a></p></section></div>{% endblock %}
