{% extends "base.html" %}
{% block content %}<div class="login-shell"><section class="login-card"><div class="eyebrow">STUDENT REGISTRATION</div><h1>Student details</h1><p class="muted">Select your class to see only its published examinations.</p><form method="post"><label>Full name<input name="full_name" required autofocus></label><label>Class<select name="class_name" required><option value="">Select your class</option>{% for class_name in classes %}<option value="{{ class_name }}">{{ class_name }}</option>{% endfor %}</select></label><button class="button primary wide">Continue to exams</button></form><p class="login-help"><a href="{{ url_for('login') }}">Back to sign in</a></p></section></div>{% endblock %}
