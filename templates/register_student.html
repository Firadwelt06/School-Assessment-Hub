{% extends "base.html" %}
{% block content %}<div class="login-shell"><section class="login-card"><div class="eyebrow">STUDENT REGISTRATION</div><h1>Student details</h1><p class="muted">Use your full name and correct arm class. Enter the subject access code supplied by the administrator.</p><form method="post"><label>Full name<input name="full_name" required autofocus></label><label>Class<select name="class_name" required><option value="">Select your class</option>{% for class_name in classes %}<option value="{{ class_name }}">{{ class_name }}</option>{% endfor %}</select></label><label>Subject<select name="access_subject" required><option value="">Select subject</option>{% for subject in subjects %}<option value="{{ subject }}">{{ subject }}</option>{% endfor %}</select></label><label>Subject access code<input name="access_code" required autocomplete="off"></label><button class="button primary wide">Continue to exams</button></form><p class="login-help"><a href="{{ url_for('login') }}">Back to sign in</a></p></section></div>{% endblock %}
