{% extends "base.html" %}
{% block content %}
<div class="topbar"><div><div class="eyebrow">EXAM BUILDER</div><h1>Create examination</h1><p class="muted">Select questions and publish a polished CBT paper.</p></div></div>
<form class="filter-bar inline-filters" method="get"><label>Filter questions by subject<select name="subject" onchange="this.form.submit()"><option value="">All subjects</option>{% for subject in subjects %}<option value="{{ subject }}" {% if subject_filter == subject %}selected{% endif %}>{{ subject }}</option>{% endfor %}</select></label><label>Filter questions by class<select name="class_name" onchange="this.form.submit()"><option value="">All classes</option>{% for class_name in classes %}<option value="{{ class_name }}" {% if class_filter == class_name %}selected{% endif %}>{{ class_name }}</option>{% endfor %}</select></label></form>
<form method="post" class="panel">
  <div class="form-grid"><label>Exam title<input name="title" placeholder="Mid-term Biology Assessment" required></label><label>Class<select name="class_name" required>{% for class_name in classes %}<option value="{{ class_name }}">{{ class_name }}</option>{% endfor %}</select></label><label>Subject{% if user.role == 'teacher' %}<select name="subject" required>{% for subject in teacher_subjects %}<option value="{{ subject }}">{{ subject }}</option>{% endfor %}</select>{% else %}<input name="subject" required>{% endif %}</label><label>Exam type<select name="exam_type">{% for exam_type in exam_types %}<option value="{{ exam_type }}">{{ exam_type|capitalize }}</option>{% endfor %}</select></label><label>Duration (minutes)<input name="duration_minutes" type="number" min="1" value="60" required></label><label class="full">Instructions<textarea name="instructions" rows="3">Choose the best answer for each question.</textarea></label></div>
  <div class="section-title"><h2>Select questions</h2><span class="muted">{{ questions|length }} available</span></div>
  <div class="question-picker">{% for q in questions %}<label class="pick"><input type="checkbox" name="question_ids" value="{{ q.id }}"><span><b>{{ q.subject }} · {{ q.topic }}{% if q.class_name %} · {{ q.class_name }}{% endif %}</b>{{ q.stem }}</span></label>{% else %}<p class="empty">Generate questions first.</p>{% endfor %}</div>
  <label class="check"><input type="checkbox" name="published"> Publish immediately to students</label>
  <button class="button primary">Create examination</button>
</form>
{% endblock %}
